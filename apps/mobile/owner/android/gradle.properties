org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation is disabled here because it fails on this
# toolchain with "Could not close incremental caches" on the transitive plugins
# (shared_preferences, and the voice plugins pulled in through jatra_core). The
# cause is a file-lock race in Kotlin's incremental compiler, not the code; the
# release build compiles clean without it. The only cost is slightly slower
# incremental rebuilds, and a release build is a full compile regardless.
kotlin.incremental=false
