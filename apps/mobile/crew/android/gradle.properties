org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Kotlin incremental compiler cannot reliably close its own caches when the
# project path contains a space, which this repository's does ("bus ticket").
# It fails at the very end of an otherwise successful compile, so the build is
# lost after several minutes of real work. Incremental compilation buys nothing
# in CI or a one-shot release build anyway.
kotlin.incremental=false
