name: jatra_crew
description: "Jatra Crew — trips, boarding and the road."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  jatra_core:
    path: ../jatra_core
  # The camera at the door. Chosen over the heavier camera plugin because the
  # only thing this app points a lens at is a QR code.
  mobile_scanner: ^7.0.0
  # Where the bus is. This is the whole reason a passenger sees a moving bus
  # instead of a timetable's guess.
  geolocator: ^13.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # MockClient, so the boarding tests exercise the real client and the real
  # error paths rather than a hand-written stand-in for them.
  http: ^1.2.0

flutter:
  uses-material-design: true
