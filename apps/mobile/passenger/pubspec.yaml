name: jatra_passenger
description: "Jatra — bus tickets for Bangladesh."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  jatra_core:
    path: ../jatra_core
  # Draws the boarding QR from the signed token the platform issued. Pure Dart
  # painting, so a ticket renders with the phone in airplane mode.
  qr_flutter: ^4.1.0
  # Fingerprint or face, to open the app. It guards nothing on the server — the
  # session token does that — it keeps a stranger holding the phone out of
  # somebody's travel history.
  local_auth: ^2.3.0
  # Departure reminders, scheduled on the device. No push service and no
  # credentials involved: the phone already knows when the bus leaves.
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  # The ticket has to be readable by a scanner in a dark doorway.
  screen_brightness: ^2.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.2.0

flutter:
  uses-material-design: true
